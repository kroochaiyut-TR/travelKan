<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanchanaburi History & Tourism Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Setup Screen -->
  <div id="setup-screen" class="screen active">
    <div class="glass-panel">
      <h1>Kanchanaburi Explorer</h1>
      <p>Discover the history and beauty of Kanchanaburi</p>
      
      <div class="form-group">
        <label for="num-players">Number of Players (2-6):</label>
        <input type="number" id="num-players" min="2" max="6" value="2">
      </div>
      
      <div id="player-names-container">
        <!-- Injected by JS -->
      </div>
      
      <div class="form-group">
        <label for="game-time">Game Time (Minutes):</label>
        <input type="number" id="game-time" min="1" max="120" value="15" placeholder="e.g. 15">
      </div>
      
      <button id="start-btn" class="btn primary-btn">Start Game</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <div style="display: flex; gap: 15px; align-items: center;">
        <div class="timer" id="timer-display">15:00</div>
        <button id="pause-btn" class="btn secondary-btn">Pause</button>
        <button id="quit-btn" class="btn secondary-btn" style="background: rgba(255, 107, 107, 0.5); border-color: transparent;">Quit</button>
      </div>
      <div class="turn-indicator" id="turn-indicator">Player 1's Turn</div>
    </header>
    
    <div class="game-container">
      <div class="board-container">
        <div id="board" class="board">
          <!-- Squares generated by JS -->
        </div>
        
        <!-- Center of board controls -->
        <div class="board-center">
          <div id="dice-container" class="dice-container">
            <div id="dice" class="dice">1</div>
          </div>
          <button id="roll-btn" class="btn action-btn">Roll Dice</button>
          <div id="action-text" class="action-text">Waiting to roll...</div>
        </div>
      </div>
      
      <div class="sidebar">
        <h2>Players</h2>
        <div id="players-list" class="players-list">
          <!-- Player cards generated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay">
    <!-- Question Modal -->
    <div id="question-modal" class="modal glass-panel">
      <h2 id="q-title">Question</h2>
      <div id="q-image-container" class="image-container" style="display: none;">
        <img id="q-image" src="" alt="Kanchanaburi Location">
      </div>
      <p id="q-text" class="question-text"></p>
      <div id="q-options" class="options-container">
        <!-- Buttons injected by JS -->
      </div>
    </div>

    <!-- Random Bonus Modal -->
    <div id="bonus-modal" class="modal glass-panel">
      <h2>Lucky Door!</h2>
      <p id="bonus-text" class="bonus-text"></p>
      <button id="bonus-continue-btn" class="btn primary-btn">Continue</button>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="modal glass-panel">
      <h2>Time's Up!</h2>
      <div id="final-scores" class="final-scores"></div>
      <button id="restart-btn" class="btn primary-btn">Play Again</button>
    </div>
  </div>

  <!-- Announcement Animation Overlay -->
  <div id="announcement" class="announcement">
    <h1 id="announce-title">Correct!</h1>
    <p id="announce-subtitle">+100 ฿</p>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
